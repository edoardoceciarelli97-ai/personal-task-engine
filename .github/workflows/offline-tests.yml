name: Personal Task Engine offline tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: sha256sum -c MANIFEST.sha256
      - run: for file in *.mjs ops/*.mjs; do node --check "$file"; done
      - run: node --test *.test.mjs ops/*.test.mjs
